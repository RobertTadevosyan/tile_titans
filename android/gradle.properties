org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# --- temporary: slow/flaky VPN link ---
# Gradle's default parallel fetching collapses the tunnel (sockets pile up in
# CLOSE_WAIT and throughput drops to zero). Serialise and be patient instead.
org.gradle.parallel=false
org.gradle.workers.max=2
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=45000
org.gradle.internal.repository.max.tentatives=30
org.gradle.internal.repository.initial.backoff=500
